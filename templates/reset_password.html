{% extends "base.html" %}
{% block robots %}noindex, follow{% endblock %}

{% block title %}Yeni Şifre Belirleyin — Commit Günlüğü{% endblock %}

{% block content %}
<div class="container auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-badge-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="18" r="3"/>
          <circle cx="6" cy="6" r="3"/>
          <path d="M18 15V9a6 6 0 0 0-6-6H6"/>
        </svg>
      </div>
      <h2>Yeni Şifrenizi Belirleyin</h2>
      <p class="text-secondary">Lütfen hesabınız için güçlü ve yeni bir şifre girin.</p>
    </div>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/reset-password" class="auth-form">
      <input type="hidden" name="token" value="{{ token }}">

      <div class="form-group">
        <label for="password">Yeni Şifre (En az 8 karakter)</label>
        <input type="password" id="password" name="password" required minlength="8" autofocus class="input-text" placeholder="••••••••">
      </div>

      <div class="form-group">
        <label for="password_confirm">Yeni Şifre Tekrar</label>
        <input type="password" id="password_confirm" name="password_confirm" required minlength="8" class="input-text" placeholder="••••••••">
      </div>

      <button type="submit" class="btn btn-primary btn-block">Şifremi Güncelle ve Giriş Yap</button>
    </form>
  </div>
</div>
{% endblock %}
