{% extends "base.html" %}

{% block title %}Kayıt Ol — Commit Günlüğü{% endblock %}

{% block content %}
<div class="container auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-badge-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="18" r="3"/>
          <circle cx="6" cy="6" r="3"/>
          <path d="M18 15V9a6 6 0 0 0-6-6H6"/>
        </svg>
      </div>
      <h2>Yeni Hesap Oluşturun</h2>
      <p class="text-secondary">GitHub depolarınız için otomatik sürüm günlüğü motorunu başlatın</p>
    </div>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/register" class="auth-form">
      <div class="form-group">
        <label for="name">Ad Soyad / Unvan (İsteğe Bağlı)</label>
        <input type="text" id="name" name="name" value="{{ name or '' }}" class="input-text" placeholder="ör. Ahmet Yılmaz">
      </div>

      <div class="form-group">
        <label for="email">E-posta Adresi</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required class="input-text" placeholder="ornek@alanadi.com">
      </div>

      <div class="form-group">
        <label for="password">Şifre (En az 8 karakter)</label>
        <input type="password" id="password" name="password" required minlength="8" class="input-text" placeholder="••••••••">
      </div>

      <div class="form-group">
        <label for="password_confirm">Şifre Tekrar</label>
        <input type="password" id="password_confirm" name="password_confirm" required minlength="8" class="input-text" placeholder="••••••••">
      </div>

      <div class="form-checkbox">
        <input type="checkbox" id="accept_terms" name="accept_terms" required>
        <label for="accept_terms" style="font-size: 0.85rem; font-weight: normal; margin-bottom: 0;">
          <a href="/terms" target="_blank" class="text-link">Kullanım Şartları</a>'nı ve 
          <a href="/privacy" target="_blank" class="text-link">KVKK Gizlilik Politikası</a>'nı okudum, kabul ediyorum.
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block">Hesap Oluştur</button>
    </form>

    <div class="auth-footer">
      <p>Zaten bir hesabınız var mı? <a href="/login" class="text-link">Giriş Yapın</a></p>
    </div>
  </div>
</div>
{% endblock %}
